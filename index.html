<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Music</title>
    <style>
        h1 {
            color: red;
        }
    </style>
</head>
<body>
    <button id="playButton">ランダム再生</button>
    <button id="formButton">フォームに飛ぶ</button>

    <script> // URLのリスト
    const urlList = [
      'https://www.youtube.com/watch?v=SX_ViT4Ra7k&t=60',
      'https://gitgorira.github.io/Money-site/'
    ];

    const button = document.getElementById('playButton');
    const formButton = document.getElementById('formButton');
    let externalWindow = null; // 外部ウィンドウの参照を保管

    button.addEventListener('click', () => { // 重複して開かせない
      if (externalWindow) {
        externalWindow.close();
      }

      const randomIndex = Math.floor(Math.random() * urlList.length); // urlListからランダムに1つのURLを選ぶ
      const randomUrl = urlList[randomIndex];

      externalWindow = window.open(randomUrl, 'external', 'width=800,height=600'); // 選んだURLを新しいウィンドウで開く
    });

    formButton.addEventListener('click', () => {
      window.open('https://forms.gle/example', '_blank'); //googleformへ
    });
  </script>
  
</body>
</html>
