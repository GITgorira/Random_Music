<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <style>
        h1 {
            color: black;
            font-size: clamp(8px, 10vw, 20px);
        }
        p {
            color: black;
            font-size: clamp(6px, 8vw, 16px);
        }
        button {
            font-size: clamp(24px, 18vw, 28px);
            padding: clamp(16px, 16vw, 24px) clamp(36px, 30vw, 48px);
            margin: clamp(8px, 14vw, 16px);
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        @media (min-width: 768px) {
        h1 {
            color: black;
            font-size: clamp(24px, 20vw, 32px);
        }
        p {
            color: black;
            font-size: clamp(24px, 18vw, 24px);
        }
        button {
            font-size: clamp(24px, 18vw, 28px);
            padding: clamp(16px, 16vw, 24px) clamp(40px, 30vw, 54px);
            margin: clamp(8px, 14vw, 16px);
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        }
    </style>
</head>
<body>
    <h1>手順</h1>
    <p>「ランダムな曲を再生」ボタンを押してください。</p>
    <p>ランダムな曲のサイトに飛びます。</p>
    <p>曲を30秒程度聞いてください。</p>
    <p>なお、曲はサビから始まります。</p>
    <p>30秒聞いた後は、</p>
    <p>下部の「アンケートへ進む」ボタンを押して質問に答えてください。</p>
    <br><br>
    <div class="button-container">
        <button id="playButton">ランダムな曲を再生</button>
        <button id="formButton" disabled>アンケートへ進む</button>
    </div>

    <script> // URLのリスト
    const urlList = [
        'https://youtube.com/watch?v=wyGr9EFuxSE&si=AGodJy0PP7260Qop&t=129',
        'https://youtube.com/watch?v=XNURRmk8YrQ&si=ZibFdnDhchDmV8fe&t=125',
        'https://youtube.com/watch?v=p3V8-bBsN2U&si=l6E-KnbxSplAhE8p&t=53',
        'https://youtube.com/watch?v=Aw2kcRynJnE&si=b23IV3ai52XJyv4H&t=92',
        'https://youtube.com/watch?v=hSdcy2_vtaQ&si=-SLfehx1KXeuKZq&t=50',
        'https://www.youtube.com/watch?v=IPBXepn5jTA&t=76',
        'https://www.youtube.com/watch?v=Gcvk4zcu25c&t=90',
        'https://www.youtube.com/watch?v=1IlTeOMCNJU&t=26',
        'https://www.youtube.com/watch?v=VtqnjYMdCAQ&t=30',
        'https://youtu.be/GXh57ZcnyYg?si=AuLclAvddkWrr1Gb&t=70', //10
        'https://youtube.com/watch?v=5GxpyQvxllA&si=KvSH-1f-J-sw7W6U&t=68',
        'https://youtube.com/watch?v=MXKk8lxWGkc&si=mMUTNosgOTa3H9rT&t=42',
        'https://youtube.com/watch?v=KftLSF5mAjE&si=ljs2caz9cuWJ9GFn&t=67',
        'https://youtube.com/watch?v=q24ZWYA_xgo&si=OqENmHgwYShvM4ub&t=57',
        'https://youtube.com/watch?v=sRj0Tpfwlr0&si=66RhzZn8nBy-NDdq&t=107',
        'https://youtube.com/watch?v=Fmz-JgkX1y4&si=LT-r_sdEMklnHj8d&t=60',
        'https://www.youtube.com/watch?v=2v8iq3tI0gM&t=250',
        'https://www.youtube.com/watch?v=Y_VyszSZdMc&t=101',
        'https://www.youtube.com/watch?v=SIuF37EWaLU&t=60',
        'https://www.youtube.com/watch?v=ZeIGVnkYX04&t=40', //20
        'https://www.youtube.com/watch?v=K8IHUMUq1Ac&t=48',
    ];

    const button = document.getElementById('playButton');
    const formButton = document.getElementById('formButton');
    let externalWindow = null; // 外部ウィンドウの参照を保管
    let selectedSongIndex = null; // 選ばれた曲の番号を保管

    button.addEventListener('click', () => { // 重複して開かせない
      if (externalWindow) {
        externalWindow.close();
      }

      const randomIndex = Math.floor(Math.random() * urlList.length); // urlListからランダムに1つのURLを選ぶ
      selectedSongIndex = randomIndex + 1; // 番号を1から始まるように調整（0ベースを1ベースに変更）
      const randomUrl = urlList[randomIndex];

      externalWindow = window.open(randomUrl, 'external', 'width=800,height=600'); // 選んだURLを新しいウィンドウで開く
      
      // フォームボタンを有効化
      formButton.disabled = false;
      
      // プレイボタンを無効化
      button.disabled = true;
    });

    formButton.addEventListener('click', () => {
      // selectedSongIndexがnullの場合は処理を中止
      if (selectedSongIndex === null) {
        alert('先に「ランダム再生」ボタンを押してください。');
        return;
      }

      // GoogleフォームのベースURL
      const formBaseUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSecyY_eLpv8jL65BBregBx1emAiIrZBOsBp4ZX_risK_hMXhw/viewform';
      
      // 曲番号が選ばれている場合はクエリパラメータを追加
      let formUrl = formBaseUrl;
      if (selectedSongIndex !== null) {
        // entry.〇〇の〇〇部分を、Googleフォームの実際のentry IDに
        formUrl = `${formBaseUrl}?usp=header&entry.123456=${selectedSongIndex}`;
      } else {
        formUrl = `${formBaseUrl}?usp=header`;
      }
      
      window.open(formUrl);
    });
  </script>
  
</body>
</html>
