<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <style>
        h1 {
            color: black;
            font-size: clamp(8px, 10vw, 20px);
        }
        p {
            color: black;
            font-size: clamp(6px, 8vw, 16px);
        }
        button {
            font-size: clamp(24px, 18vw, 28px);
            padding: clamp(16px, 16vw, 24px) clamp(36px, 30vw, 48px);
            margin: clamp(8px, 14vw, 16px);
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        @media (min-width: 768px) {
        h1 {
            color: black;
            font-size: clamp(24px, 20vw, 32px);
        }
        p {
            color: black;
            font-size: clamp(24px, 18vw, 24px);
        }
        button {
            font-size: clamp(24px, 18vw, 28px);
            padding: clamp(16px, 16vw, 24px) clamp(40px, 30vw, 54px);
            margin: clamp(8px, 14vw, 16px);
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        }
    </style>
</head>
<body>
    <h1>手順</h1>
    <p>「ランダムな曲を再生」ボタンを押してください。</p>
    <p>ランダムな曲のサイトに飛びます。</p>
    <p>曲を30秒程度聞いてください。</p>
    <p>なお、曲はサビから始まります。</p>
    <p>曲を聞いた後は、</p>
    <p>下部の「アンケートへ進む」ボタンを押して質問に答えてください。</p>
    <br><br>
    <div class="button-container">
        <button id="playButton">ランダムな曲を再生</button>
        <button id="formButton" disabled>アンケートへ進む</button>
    </div>

    <script>
    // URLと曲名のマッピング
    const songList = [
        { url: 'https://youtube.com/watch?v=wyGr9EFuxSE&si=AGodJy0PP7260Qop&t=129', name: '1' },
        { url: 'https://youtube.com/watch?v=XNURRmk8YrQ&si=ZibFdnDhchDmV8fe&t=125', name: '2' },
        { url: 'https://youtube.com/watch?v=p3V8-bBsN2U&si=l6E-KnbxSplAhE8p&t=53', name: '3' },
        { url: 'https://youtube.com/watch?v=Aw2kcRynJnE&si=b23IV3ai52XJyv4H&t=92', name: '4' },
        { url: 'https://youtube.com/watch?v=hSdcy2_vtaQ&si=-SLfehx1KXeuKZq&t=50', name: '5' },
        { url: 'https://www.youtube.com/watch?v=IPBXepn5jTA&t=76', name: '6' },
        { url: 'https://www.youtube.com/watch?v=Gcvk4zcu25c&t=90', name: '7' },
        { url: 'https://www.youtube.com/watch?v=1IlTeOMCNJU&t=26', name: '8' },
        { url: 'https://www.youtube.com/watch?v=VtqnjYMdCAQ&t=30', name: '9' },
        { url: 'https://youtu.be/GXh57ZcnyYg?si=AuLclAvddkWrr1Gb&t=70', name: '10' },
        { url: 'https://youtube.com/watch?v=5GxpyQvxllA&si=KvSH-1f-J-sw7W6U&t=68', name: '11' },
        { url: 'https://youtube.com/watch?v=MXKk8lxWGkc&si=mMUTNosgOTa3H9rT&t=42', name: '12' },
        { url: 'https://youtube.com/watch?v=KftLSF5mAjE&si=ljs2caz9cuWJ9GFn&t=67', name: '13' },
        { url: 'https://youtube.com/watch?v=q24ZWYA_xgo&si=OqENmHgwYShvM4ub&t=57', name: '14' },
        { url: 'https://youtube.com/watch?v=sRj0Tpfwlr0&si=66RhzZn8nBy-NDdq&t=107', name: '15' },
        { url: 'https://youtube.com/watch?v=Fmz-JgkX1y4&si=LT-r_sdEMklnHj8d&t=60', name: '16' },
        { url: 'https://www.youtube.com/watch?v=2v8iq3tI0gM&t=250', name: '17' },
        { url: 'https://www.youtube.com/watch?v=Y_VyszSZdMc&t=101', name: '18' },
        { url: 'https://www.youtube.com/watch?v=SIuF37EWaLU&t=60', name: '19' },
        { url: 'https://www.youtube.com/watch?v=ZeIGVnkYX04&t=40', name: '20' },
    ];

    const button = document.getElementById('playButton');
    const formButton = document.getElementById('formButton');
    let externalWindow = null; // 外部ウィンドウの参照を保管
    let selectedSongName = null; // 選ばれた曲の名前を保管

    button.addEventListener('click', () => { // 重複して開かせない
      if (externalWindow) {
        externalWindow.close();
      }

      const randomIndex = Math.floor(Math.random() * songList.length); // songListからランダムに1つを選ぶ
      selectedSongName = songList[randomIndex].name; // 曲名を保管
      const randomUrl = songList[randomIndex].url;

      externalWindow = window.open(randomUrl, 'external', 'width=800,height=600'); // 選んだURLを新しいウィンドウで開く
      
      // フォームボタンを有効化
      formButton.disabled = false;
      
      // プレイボタンを無効化
      button.disabled = true;
    });

    formButton.addEventListener('click', () => {
      // selectedSongNameがnullの場合は処理を中止
      if (selectedSongName === null) {
        alert('先に「ランダム再生」ボタンを押してください。');
        return;
      }

      // GoogleフォームのベースURL
      const formBaseUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSecyY_eLpv8jL65BBregBx1emAiIrZBOsBp4ZX_risK_hMXhw/viewform';
      
      // 曲名をクエリパラメータとして追加
      const formUrl = `${formBaseUrl}?usp=header&entry.1417319277=${encodeURIComponent(selectedSongName)}`;
      
      window.open(formUrl);
    });
    </script>
  
</body>
</html>
