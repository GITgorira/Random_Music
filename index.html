<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            background-color: black;
            color: white;
            padding: clamp(10px, 8vw, 18px) clamp(14px, 6vw, 22px);
            text-align: left;
        }
        header h1 {
            color: white;
            font-size: clamp(16px, 10vw, 24px);
        }

        h1 {
            color: black;
            font-size: clamp(8px, 10vw, 20px);
        }
        p {
            color: black;
            font-size: clamp(6px, 8vw, 16px);
        }
        p2 {
            color: red;
            font-size: clamp(6px, 8vw, 16px);
        }
        button {
            font-size: clamp(24px, 18vw, 28px);
            padding: clamp(16px, 16vw, 24px) clamp(36px, 30vw, 48px);
            margin: clamp(8px, 14vw, 16px);
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        @media (min-width: 768px) {
        header {
            background-color: black;
            color: white;
            padding: clamp(12px, 8vw, 20px) clamp(16px, 6vw, 24px);
            text-align: left;
        }

        header h1 {
            color: white;
            font-size: clamp(18px, 10vw, 28px);
        }
        h1 {
            color: black;
            font-size: clamp(24px, 20vw, 32px);
        }
        p {
            color: black;
            font-size: clamp(24px, 18vw, 24px);
        }
        p2 {
            color: red;
            font-size: clamp(24px, 18vw, 24px);
        }
        button {
            font-size: clamp(24px, 18vw, 28px);
            padding: clamp(16px, 16vw, 24px) clamp(40px, 30vw, 54px);
            margin: clamp(8px, 14vw, 16px);
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        }
    </style>
</head>
<body>
    <header>
        <h1>ランダム再生ページ</h1>
    </header>

    <br>
    <h1>手順</h1>
    <div id="instruction_group1">
    <p>1.「ランダムな曲を再生」をクリック</p>
    <p>2.サビから始まる曲を聴く</p>
    </div>
    <div id="instruction_group2">
    <p>3.「アンケートに進む」をクリックし、アンケートに答える</p>
    <p><span style="color: red;">※最初の『曲選択』の画面の選択肢は変えず、ページ下部の「次へ」を押してください</span></p>
    </div>
    <br><br>
    <div class="button-container">
        <button id="playButton">ランダムな曲を再生</button>
        <button id="formButton" disabled>アンケートへ進む</button>
    </div>

    <script>
    // URLと曲名のマッピング
    const songList = [
        { url: 'https://youtu.be/cCx4I4Fk5FE?si=TatlN9VXmITRXkzU&t=0', name: '1' },
        { url: 'https://www.youtube.com/watch?v=4tq0I6yI42E&t=36', name: '2' },
        { url: 'https://www.youtube.com/watch?v=PEM0Vs8jf1w&t=28', name: '3' },
        { url: 'https://www.youtube.com/watch?v=KET3xqMQxtg&t=52', name: '4' },
        { url: 'https://www.youtube.com/watch?v=DyWgcE9EpKw&t=45', name: '5' },
        { url: 'https://www.youtube.com/watch?v=mEQZNRT6Pqk&t=58', name: '6' },
        { url: 'https://www.youtube.com/watch?v=lSD_L-xic9o&t=51', name: '7' },
        { url: 'https://www.youtube.com/watch?v=n9Nrl9qXxow&t=55', name: '8' },
        { url: 'https://www.youtube.com/watch?v=jTgECEJUXMQ&t=43', name: '9' },
        { url: 'https://www.youtube.com/watch?v=mHrjM6oVez0&t=95', name: '10' },
        { url: 'https://www.youtube.com/watch?v=R8FHtIhWqNo&t=52', name: '11' },
        { url: 'https://www.youtube.com/watch?v=Aw2kcRynJnE&t=92', name: '12' },
        { url: 'https://www.youtube.com/watch?v=IPBXepn5jTA&t=76', name: '13' },
        { url: 'https://www.youtube.com/watch?v=Y_VyszSZdMc&t=101', name: '14' },
        { url: 'https://www.youtube.com/watch?v=K8IHUMUq1Ac&t=48', name: '15' },
        { url: 'https://www.youtube.com/watch?v=MXKk8lxWGkc&t=41', name: '16' },
        { url: 'https://www.youtube.com/watch?v=sRj0Tpfwlr0&t=106', name: '17' },
        { url: 'https://www.youtube.com/watch?v=q24ZWYA_xgo&t=57', name: '18' },
        { url: 'https://www.youtube.com/watch?v=62R6acSJZ3M&t=10', name: '19' },
        { url: 'https://www.youtube.com/watch?v=30u-QIoDPt0&t=69', name: '20' },
    ];

    const button = document.getElementById('playButton');
    const formButton = document.getElementById('formButton');
    let externalWindow = null; // 外部ウィンドウの参照を保管
    let selectedSongName = null; // 選ばれた曲の名前を保管

    // ここでボタンの状態を表すフラグを持たせる
    let playButtonState = true;

    function updateInstructionVisibility() {
      const group1 = document.getElementById('instruction_group1');
      if (group1) {
        group1.style.display = playButtonState ? 'none' : 'block';
      }
      const group2 = document.getElementById('instruction_group2');
      if (group2) {
        group2.style.display = playButtonState ? 'block' : 'none';
      }
    }

    // 初期表示を反映
    updateInstructionVisibility();

    button.addEventListener('click', () => { // 重複して開かせない
      if (externalWindow) {
        externalWindow.close();
      }

      const randomIndex = Math.floor(Math.random() * songList.length); // songListからランダムに1つを選ぶ
      selectedSongName = songList[randomIndex].name; // 曲名を保管
      const randomUrl = songList[randomIndex].url;

      externalWindow = window.open(randomUrl, 'external', 'width=800,height=600'); // 選んだURLを新しいウィンドウで開く
      
      // フォームボタンを有効化
      formButton.disabled = false;
      
      // プレイボタンを無効化
      button.disabled = true;

      // 状態を falseに
      playButtonState = false;
      updateInstructionVisibility();
    });

    formButton.addEventListener('click', () => {
      // selectedSongNameがnullの場合は処理を中止
      if (selectedSongName === null) {
        alert('先に「ランダム再生」ボタンを押してください。');
        return;
      }

      // GoogleフォームのベースURL
      const formBaseUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSecyY_eLpv8jL65BBregBx1emAiIrZBOsBp4ZX_risK_hMXhw/viewform';
      
      // 曲名をクエリパラメータとして追加
      const formUrl = `${formBaseUrl}?usp=header&entry.1417319277=${encodeURIComponent(selectedSongName)}`;
      
      window.open(formUrl);
    });
    </script>
  
</body>
</html>
